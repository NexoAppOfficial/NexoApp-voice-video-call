<script>
  const appID = 233961104;
  const serverSecret = "f043619bceef40c26c0c3b46432eca06";
  const q = new URLSearchParams(window.location.search);
  const roomID = q.get("roomID");
  const userID = q.get("userID");
  const userName = q.get("userName") || "User";
  const media = q.get("media") || "voice";

  if (!roomID || !userID) {
    document.body.innerHTML = "<p style='padding:20px'>Call not ready.</p>";
  } else {
    const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
      appID, serverSecret, roomID, userID, userName);
    const zp = ZegoUIKitPrebuilt.create(kitToken);
    zp.joinRoom({
      container: document.querySelector("#root"),
      scenario: { mode: ZegoUIKitPrebuilt.OneONoneCall },
      maxUsers: 2,
      turnOnCameraWhenJoining: media === "video",
      turnOnMicrophoneWhenJoining: true,
      showMyCameraToggleButton: true,
      showMyMicrophoneToggleButton: true,
      showAudioVideoSettingsButton: true,
      showTextChat: true,
      showPreJoinView: false,
    });
  }
</script>
