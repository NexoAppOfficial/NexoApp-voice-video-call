<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexoApp Call</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111}
#root{width:100vw;height:100vh}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#000;color:#fff;font:13px sans-serif;padding:8px}
</style>
</head>
<body>
<div id="root"></div>
<div id="msg">Loading call...</div>
<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
<script>
(function () {
  var msg = document.getElementById("msg");
  function say(t) { msg.textContent = t; }
  window.onerror = function (m) { say("Error: " + m); };
  window.addEventListener("unhandledrejection", function (e) {
    say("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  var q = new URLSearchParams(window.location.search);
  var roomID = q.get("roomID") || "test1";
  var userID = "userID";
  var userName = q.get("userName") || "User";
  var media = q.get("media") || "video";
  if (typeof ZegoUIKitPrebuilt === "undefined") { say("Call library did not load."); return; }
  var appID = 233961104;
  var token = "04AAAAAGr6m1EADG1izbzXYEOPzCe/MwCv/KxvfBb09f08lTTemSDGCip7YCaMVc4LTQnlZYw4pHER+n5MvezYWF4vAao6MzFKt+3RBAt7GpcHLhohHJ2VhF01LkkPA230YYXjjPdsCIJCcD/CMe7Ms7AWsVWGvO90GGF9pu9MrebsexmBQOV4liB4Xx6EXDj53xwZHLffCGXOdmMUbvoxdkviXTLn10YhCDkTJGL1Wgt17G4q3MXE1bbQJu/t5NclsY9/OF9qWAE=";
  try {
    var kitToken = ZegoUIKitPrebuilt.generateKitTokenForProduction(appID, token, roomID, userID, userName);
    var zp = ZegoUIKitPrebuilt.create(kitToken);
    zp.joinRoom({
      container: document.querySelector("#root"),
      scenario: { mode: ZegoUIKitPrebuilt.OneONoneCall },
      maxUsers: 2,
      turnOnCameraWhenJoining: media === "video",
      turnOnMicrophoneWhenJoining: true,
      showPreJoinView: false,
      showTextChat: true
    });
    say("Joining room " + roomID + " as " + userID + "...");
  } catch (err) { say("Error: " + err.message); }
})();
</script>
</body>
</html>
